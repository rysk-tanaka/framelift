# Publishes to PyPI with Trusted Publishing (no API token is stored anywhere).
#
# One-time setup:
#   1. PyPI → Account settings → Publishing → add a pending publisher:
#        project: framelift, owner: rysk-tanaka, repository: framelift,
#        workflow: release.yml, environment: pypi
#   2. GitHub → Settings → Environments → create "pypi" (optionally add yourself as a required reviewer)
#
# Release: bump `version` in pyproject.toml, update CHANGELOG.md, then merge to main. The tag
# `v<version>` and the GitHub Release are created here, followed by the PyPI upload.
#
# Tag creation and publishing live in one workflow on purpose: a tag pushed with GITHUB_TOKEN
# does not trigger other workflows, and PyPI trusts this file by name.
#
# Rerun with workflow_dispatch when the tag already exists but publishing failed.
name: release

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      # push is already filtered to main; this guards workflow_dispatch from other branches
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow can only be run from the main branch (current: ${GITHUB_REF})"
          exit 1

  create-release:
    needs: validate-branch
    permissions:
      contents: write
    uses: rysk-tanaka/workflows/.github/workflows/release-on-version-change.yml@d7782d948c15ff4a2d2e452b86e8265c1eb98a94 # main
    with:
      version_source: pyproject
      tag_prefix: v
      force_released_output: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  build:
    needs: create-release
    if: needs.create-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/framelift/
    permissions:
      id-token: write # required to request the OIDC token; granted to this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # a workflow_dispatch rerun may find this version already on PyPI
          skip-existing: true
