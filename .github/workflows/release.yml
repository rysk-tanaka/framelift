# Publishes to PyPI with Trusted Publishing (no API token is stored anywhere).
#
# One-time setup:
#   1. PyPI → Account settings → Publishing → add a pending publisher:
#        project: framelift, owner: rysk-tanaka, repository: framelift,
#        workflow: release.yml, environment: pypi
#   2. GitHub → Settings → Environments → create "pypi" (optionally add yourself as a required reviewer)
#
# Release: bump `version` in pyproject.toml, update CHANGELOG.md, then push a tag `v<version>`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/framelift/
    permissions:
      id-token: write # required to request the OIDC token; granted to this job only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
